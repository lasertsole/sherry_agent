version: 2

# Dependabot reads this file from the default branch (main), but every update
# stream below targets `dev`: there are no main-targeted version-update entries.
# The dev branch already exists; Dependabot does not create it.
#
# GitHub security updates are a separate repository setting. They always target
# the default branch and cannot be redirected by target-branch; if main must
# receive none, disable Dependabot security updates in repository settings.
#
# Keep ignore / groups / commit-message / labels complete on every entry:
# there is no cross-entry inheritance, and YAML anchors are not used here.
updates:
  # ── 后端 Python (uv) → dev ────────────────────────────
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # 仅忽略「上游永不会发布修复」的依赖；版本精确锁定，升级会重新触发评估。
    ignore:
      - dependency-name: "accelerate"
        versions: ["=1.14.0"]
      - dependency-name: "diskcache"
        versions: ["=5.6.3"]
      - dependency-name: "ragas"
        versions: ["=0.4.3"]
    groups:
      production-deps:
        patterns:
          - "langchain*"
          - "langgraph*"
          - "robyn"
          - "loguru"
          - "dotenv"
          - "aiosqlite"
          - "croniter"
          - "pillow"
          - "opencv-python-headless"
          - "instructor"
          - "json_repair"
          - "json5"
          - "gguf"
          - "pipmaster"
          - "snkv"
          - "websockets"
          - "websocket-client"
      dev-deps:
        dependency-type: "development"
    commit-message:
      prefix: "deps(backend)"
    labels:
      - "dependencies"
      - "backend"

  # ── 前端 npm (pnpm) → dev ─────────────────────────────
  - package-ecosystem: "npm"
    directory: "/client"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # Nuxt/Vue 生态的 minor/major 升级手动评估；
      # patch（含安全补丁）仍会自动提 PR。
      - dependency-name: "nuxt"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@nuxt/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@nuxtjs/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "nitropack"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "vue"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@pinia/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "pinia*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      nuxt-ecosystem:
        patterns:
          - "nuxt"
          - "vue"
          - "vue-router"
          - "@nuxtjs/*"
          - "@pinia/*"
          - "pinia*"
      ui-ecosystem:
        patterns:
          - "primevue"
          - "@primevue/*"
          - "tailwindcss"
          - "@tailwindcss/*"
      dev-tools:
        dependency-type: "development"
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - "dependencies"
      - "frontend"

  # ── GitHub Actions 版本 → dev ─────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(ci)"
    labels:
      - "dependencies"
      - "ci"
