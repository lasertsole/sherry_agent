# Desktop builds: three-platform Tauri installers.
#
# Each installer is UNIFIED: the SPA, the Rust shell and the CPU Python backend
# tree are packed together (`bundle.resources = ["sherry-backend/"]`). There is
# no separate backend archive and no first-run backend download; each matrix leg
# builds its own backend tree immediately before `pnpm tauri build`.
#
#   push to main / a v* tag / manual dispatch -> build and upload artifacts
#   a v* tag additionally creates the GitHub Release (assets from a branch push
#   are temporary: 90 days, Actions storage)
#
# PyInstaller cannot cross-compile, so every OS builds its own tree. On Linux,
# PyPI's torch wheel pulls ~5 GiB of CUDA/cuDNN/nccl payload; the CPU-only wheel
# keeps the installer and the published artifact inside the release-size budget.
# The optional CUDA acceleration pack remains a separate Linux asset.

name: Desktop build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Never cancel a build in flight: a tag push must be able to publish, and a
# half-uploaded 2 GiB artifact is worse than a slow queue.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── The optional CUDA pack (Linux; the model settings tab's opt-in) ──────
  build-cuda-pack:
    name: CUDA pack (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # NO CPU-torch swap here: the pack is exactly the CUDA payload the lock
      # resolves on Linux (nvidia-* wheels + triton + torch's CUDA binaries).
      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build the CUDA pack
        run: uv run --no-sync python packaging/build_cuda_pack.py

      - name: Compress the CUDA pack
        run: |
          cd client/src-tauri/sherry-cuda-pack
          tar czf "${{ github.workspace }}/sherry-cuda-pack-linux-x86_64.tar.gz" .

      - name: Drop the build residue
        run: rm -rf client/src-tauri/sherry-cuda-pack build/pyinstaller-cuda

      - uses: actions/upload-artifact@v4
        with:
          name: sherry-cuda-pack-linux-x86_64
          path: sherry-cuda-pack-linux-x86_64.tar.gz
          retention-days: 90
          if-no-files-found: error

  # ── The unified installers (SPA + Rust shell + bundled CPU backend) ─────
  build-tauri:
    name: Installer (${{ matrix.platform }})
    # One artifact: the backend tree is built in this job and packed through
    # bundle.resources; there is no separate backend archive or download.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Swap in CPU-only PyTorch (Linux)
        if: matrix.platform == 'linux'
        run: |
          # Drop the CUDA family the lock installs for Linux, then re-install
          # torch/torchvision from PyTorch's CPU index. The index proxies PyPI for
          # every other name, so only the two torch packages change wheels.
          uv pip freeze | grep -Ei '^(nvidia-|cuda-|triton)' | cut -d= -f1 | xargs -r uv pip uninstall
          uv pip uninstall torch torchvision
          uv pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0" "torchvision==0.29.0"

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      # `--no-sync` is load-bearing: a plain `uv run` would re-sync the venv from
      # the lock and silently put CUDA PyTorch back on Linux.
      - name: Build the bundled backend tree
        run: uv run --no-sync python packaging/build_backend.py

      - name: Verify psutil made it into the frozen tree (load gate)
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" - <<'EOF'
          import pathlib
          import sys

          tree = pathlib.Path("client/src-tauri/sherry-backend/_internal")
          hits = sorted(p for p in tree.rglob("psutil*"))
          print(f"psutil payload entries: {len(hits)}")
          for hit in hits[:5]:
              print(" ", hit.relative_to(tree))
          sys.exit(0 if hits else "psutil is MISSING from the frozen backend tree")
          EOF

      - name: Verify botpy made it into the frozen tree (QQ channel)
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" - <<'EOF'
          import pathlib
          import sys

          tree = pathlib.Path("client/src-tauri/sherry-backend/_internal")
          hits = sorted(p for p in tree.rglob("botpy*"))
          print(f"botpy payload entries: {len(hits)}")
          for hit in hits[:5]:
              print(" ", hit.relative_to(tree))
          sys.exit(0 if hits else "botpy is MISSING from the frozen backend tree")
          EOF

      - name: Audit the bundled backend tree (no tests/docs/wiki)
        run: uv run --no-sync python packaging/check_release.py backend client/src-tauri/sherry-backend

      # Tauri's Linux webview + bundler prerequisites (Ubuntu 24.04 names).
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      # `beforeBuildCommand` runs `nuxt generate`; the Rust shell is compiled
      # and every platform's bundler packs the SPA plus the backend tree built
      # above through `bundle.resources`.
      - name: Build the installers
        working-directory: client
        run: pnpm tauri build

      # The installer payload is the SPA in .output/public; assert it carries no
      # tests/docs/wiki (or Markdown) before it is bundled/uploaded.
      - name: Audit the frontend bundle (no tests/docs/wiki)
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" packaging/check_release.py frontend client/.output/public

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-installer-${{ matrix.platform }}
          path: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/rpm/*.rpm
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 90
          if-no-files-found: error

  # ── Publish (tag pushes only) ────────────────────────────────────────────
  # A release carries the unified installers for each platform. There is no
  # backend archive to publish; the optional CUDA pack stays in Actions storage
  # because it exceeds GitHub's per-asset size cap.
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-cuda-pack, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # GitHub caps a single release asset at 2 GiB and the optional CUDA pack
      # is larger than that; it stays downloadable from the Actions artifact.
      - name: Drop the oversized CUDA pack before publishing
        run: rm -f artifacts/sherry-cuda-pack-linux-x86_64.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: artifacts/**/*
