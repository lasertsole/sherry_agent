# CI: hermetic test gate.
#
# Runs the repo's own 3-process split runner (tests/run_tests_split.py):
#   GROUP A = marker:unit, GROUP B = marker:integration+module+system, C = regression.
# Real-LLM network tests (llm_e2e / tests/full) are excluded by design and
# have a dedicated manually-dispatched workflow (llm-e2e.yml).
#
# Heavy local-inference packages (llama-cpp-python, funasr, torch) are NOT
# installed: the hermetic suite was verified to pass without them. Skipping
# them avoids a multi-GB CUDA/torch download and a llama-cpp-python source
# build on the runner.
# NOTE: `uv run --no-sync` below is REQUIRED - a plain `uv run` would re-sync
# the lockfile and silently reinstall the excluded packages.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Hermetic tests (split runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies (minus heavy local-inference packages)
        run: >
          uv sync --frozen
          --no-install-package llama-cpp-python
          --no-install-package funasr
          --no-install-package torch

      - name: Run hermetic test suite
        run: uv run --no-sync python tests/run_tests_split.py

      - name: Check README structural parity (4 languages)
        run: uv run --no-sync python scripts/check_docs_parity.py

      - name: Check Markdown links and anchors
        run: uv run --no-sync python scripts/check_doc_links.py

      - name: Check server layer contract
        run: uv run --no-sync lint-imports

  security-scan:
    name: Security scans (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # SAST over the project's own source. Vendored code, skill scripts,
      # evals and tests are excluded (the pre-commit hook scans vendored code
      # separately); the gate fails on high-severity/high-confidence findings
      # only, so the report stays actionable.
      - name: Static security scan (bandit)
        run: >
          uvx bandit -r agent server config models context_engine runtime pub
          workspace channels bus
          --severity-level high --confidence-level high

      # Dependency audit against the exported lockfile. Known advisories are
      # accepted explicitly in .github/security/pip-audit-ignore.txt (each with
      # a reason); anything else fails the job.
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements-audit.txt"
          args=()
          while read -r id _reason; do
            case "$id" in ''|'#'*) continue ;; esac
            args+=(--ignore-vuln "$id")
          done < .github/security/pip-audit-ignore.txt
          uvx pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" --progress-spinner off "${args[@]}"

  frontend-test:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # match the dev toolchain: pnpm 9 treats a config-only
          # client/pnpm-workspace.yaml as an empty workspace and hard-fails
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      # postinstall runs `nuxt prepare`, generating the .nuxt/ tree the
      # vitest aliases rely on
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Detect circular dependencies
        run: pnpm run dpdm
