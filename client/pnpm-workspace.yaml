allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  vue-demi: true

overrides:
  # Single vue across the graph: the ambient global declarations
  # (.nuxt/types/imports.d.ts) type against the app's vue — a second vue
  # (a devtools peer re-resolved higher) splits component-instance typing
  # and breaks vue-tsc bare-symbol resolution.
  vue: 3.5.43
  'qs@<6.16.0': '>=6.16.0'
  'svgo@>=4.0.0 <4.1.0': '>=4.1.0'
  # katex: transitive via @eslint/markdown > micromark-extension-math (still
  # declares ^0.16); forced to the patched line for GHSA-238p-pmpm-9mq7. Only
  # the markdown lint chain touches it, never the app bundle.
  katex: ^0.18.2
  'undici@<8.12.2': '>=8.12.2'
  'launch-editor@<2.14.2': '>=2.14.2'
  'serialize-javascript@<7.1.3': '>=7.1.3'
  'fast-uri@<3.1.9': '>=3.1.9'
  'zod@<4.6.6': '>=4.6.6'
  'vite@<8.3.3': '>=8.3.3'
