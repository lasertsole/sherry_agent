allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  vue-demi: true

minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.45'
  - '@vue/compiler-dom@3.5.45'
  - '@vue/compiler-sfc@3.5.45'
  - '@vue/compiler-ssr@3.5.45'
  - '@vue/reactivity@3.5.45'
  - '@vue/runtime-core@3.5.45'
  - '@vue/runtime-dom@3.5.45'
  - '@vue/server-renderer@3.5.45'
  - '@vue/shared@3.5.45'
  - vue@3.5.45

overrides:
  # Single vue across the graph: the ambient global declarations
  # (.nuxt/types/imports.d.ts) type against the app's vue — a second vue
  # (a devtools peer re-resolved higher) splits component-instance typing
  # and breaks vue-tsc bare-symbol resolution.
  vue: 3.5.45
  'qs@<6.16.1': '>=6.16.1'
  # GHSA-xxxx advisories below: the parent packages still declare the
  # vulnerable range, so a lockfile refresh alone cannot move them.
  'node-forge@<=1.4.0': '>=1.4.1'
  'minimatch@>=7.0.0 <11.0.1': '>=11.0.1'
  'glob@>=9.0.0 <14.0.2': '>=14.0.2'
  'vue-i18n@<11.4.14': '>=11.4.14'
  '@intlify/core@<11.4.14': '>=11.4.14'
  '@intlify/core-base@<11.4.14': '>=11.4.14'
  '@intlify/shared@<11.4.14': '>=11.4.14'
  # deepmerge has no patched upstream release (GHSA-...): left at 4.3.1.
  'svgo@>=4.0.0 <4.1.0': '>=4.1.0'
  # katex: transitive via @eslint/markdown > micromark-extension-math (still
  # declares ^0.16); forced to the patched line for GHSA-238p-pmpm-9mq7. Only
  # the markdown lint chain touches it, never the app bundle.
  katex: ^0.18.2
  'undici@<8.12.2': '>=8.12.2'
  'launch-editor@<2.14.2': '>=2.14.2'
  'serialize-javascript@<7.1.3': '>=7.1.3'
  'fast-uri@<3.1.9': '>=3.1.9'
  'zod@<4.6.6': '>=4.6.6'
  'vite@<8.3.3': '>=8.3.3'
