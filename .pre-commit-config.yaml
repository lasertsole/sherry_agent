# Gates for every commit: backend = ruff + basedpyright, frontend = prettier +
# eslint + vue-tsc (fix-then-check), commit message = commitlint (Angular).
#
# One-time setup per clone:
#   uv sync                      # provides pre-commit in the project venv
#   uv run pre-commit install    # writes .git/hooks/pre-commit + .git/hooks/commit-msg
#
# Frontend hooks run in two phases: frontend-fix auto-corrects (prettier
# --write + eslint --fix) and fails if files changed — re-stage with `git add`
# and retry; the check-only hooks (eslint, vue-tsc) then gate the clean state.
# All other hooks are check-only.
# Frontend hooks delegate to the client/ pnpm toolchain via
# scripts/hooks/frontend-style.sh so tool versions and the flat-config live in
# client/package.json instead of being duplicated here.

default_install_hook_types: [pre-commit, commit-msg]

repos:
  # ---- backend: ruff (rule set pinned in pyproject [tool.ruff.lint]) ------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]
        # v0.16.6 adds markdown to the hook's types; this repo keeps docs
        # hand-formatted (client eslint config also disables prettier on md).
        types_or: [python, pyi, jupyter]

  # ---- backend: basedpyright type gate (config in pyproject) --------------
  # Per-file semantics: a commit only has to keep the files it TOUCHES
  # type-clean. No hook-level exclude: every touched Python file is checked
  # (pyproject [tool.basedpyright] ignore still holds the type-debt registry).
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright (types)
        entry: uv run --no-sync basedpyright
        language: system
        types: [python]
        require_serial: true

  # ---- boundary guard: frontend/Rust files must stay inside client/ -------
  # Canary hook: `files` matches the target suffixes, `exclude` removes
  # client/; when the intersection is non-empty a stray file exists and the
  # hook always fails.
  - repo: local
    hooks:
      - id: frontend-file-boundary
        name: enforce css/rs/js/ts/mjs/vue in client/
        entry: bash scripts/hooks/reject-stray-frontend.sh
        language: system
        files: \.(css|rs|js|ts|mjs|vue)$
        exclude: ^client/

  # ---- frontend: fix-then-check (client/ pnpm toolchain) ------------------
  - repo: local
    hooks:
      # Phase 1: auto-fix — prettier --write + eslint --fix
      - id: frontend-fix
        name: prettier + eslint (auto-fix)
        entry: bash scripts/hooks/frontend-fix.sh
        language: system
        require_serial: true
        files: ^client/
        types_or: [ts, tsx, vue, javascript, jsx, css, scss, json]
      # Phase 2: check-only — eslint catches unfixable lint issues
      - id: eslint
        name: eslint (check)
        entry: bash scripts/hooks/frontend-style.sh eslint
        language: system
        require_serial: true
        files: ^client/
        types_or: [ts, tsx, vue, javascript, jsx]
      # Phase 3: type check — vue-tsc on the whole project
      - id: vue-tsc
        name: vue-tsc (client types, whole project)
        entry: bash scripts/hooks/frontend-style.sh vue-tsc --noEmit -p .nuxt/tsconfig.app.json
        language: system
        pass_filenames: false
        require_serial: true
        files: ^client/.*\.(ts|tsx|vue|js|mjs|json)$

  # ---- commit message: commitlint (Angular convention) --------------------
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (angular)
        entry: bash scripts/hooks/commitlint.sh
        language: system
        stages: [commit-msg]
