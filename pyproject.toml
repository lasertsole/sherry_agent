[project]
name = "ema-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mineru-vl-utils[transformers]>=1.0.5",
    "aiosqlite>=0.22.1",
    "croniter>=6.2.2",
    "dotenv>=0.9.9",
    "editdistance>=0.8.1",
    "funasr>=1.3.9",
    "langchain>=1.3.4",
    "langchain-classic>=1.0.7",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.2.2",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "leidenalg>=0.12.0",
    "loguru>=0.7.3",
    "opencv-python-headless>=4.11.0",
    "nest-asyncio>=1.6.0",
    "pillow>=9.2.0",
    "robyn>=0.84.0",
    "snkv[vector]>=0.7.0",
    "websocket-client>=1.9.0",
    "websockets>=15.0.1",
    "langchain-mcp-adapters>=0.3.0",
    "llama-cpp-python>=0.3.31",
    "instructor>=1.15.3",
    "json_repair>=0.60.1",
    "pipmaster>=1.1.13",
    "gguf>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
editdistance = { path = "models/STT_model/editdistance-0.8.1-py3-none-any.whl" }

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "client",           # Nuxt/Tauri frontend
    "src",              # runtime data (checkpoints, media, rag index)
    "temp",
    ".omo",
    ".playwright-mcp",
]

[tool.ruff.lint]
# Keep default rule set (E4/E7/E9 + F: pyflakes)

[tool.ruff.lint.per-file-ignores]
# Vendored LightRAG / RAG-Anything code - keep close to upstream, don't chase style
"skills/builtin/core/multimodal_rag/scripts/graph_rag/vendored_raganything/*" = ["E402", "F403", "F405"]
# Skill scripts initialize env/model before imports (intentional delayed imports)
"skills/builtin/**/scripts/*" = ["E402"]
# Tests do sys.path setup before imports
"tests/**" = ["E402"]
# Vendored FunASR onnxruntime utils
"models/STT_model/utils/*" = ["E722"]
