[project]
name = "ema-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mineru-vl-utils[transformers]>=1.0.5",
    "aiosqlite>=0.22.1",
    "croniter>=6.2.2",
    "dotenv>=0.9.9",
    "editdistance>=0.8.1",
    "funasr>=1.3.9",
    "langchain>=1.3.4",
    "langchain-classic>=1.0.7",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.2.2",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "leidenalg>=0.12.0",
    "loguru>=0.7.3",
    "opencv-python-headless>=4.11.0",
    "nest-asyncio>=1.6.0",
    "pillow>=9.2.0",
    "robyn>=0.84.0",
    "snkv[vector]>=0.7.0",
    "websocket-client>=1.9.0",
    "websockets>=15.0.1",
    "langchain-mcp-adapters>=0.3.0",
    "llama-cpp-python>=0.3.31",
    "instructor>=1.15.3",
    "json_repair>=0.60.1",
    "pipmaster>=1.1.13",
    "gguf>=0.19.0",
    "json5>=0.15.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.0",
    "pre-commit>=4.6.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "import-linter>=2.1",
]

[tool.pytest.ini_options]
# Real-LLM network e2e tests are slow, cost API tokens and are order-sensitive:
# deselect them by default; run them explicitly with `pytest -m llm_e2e`.
addopts = "-m 'not llm_e2e'"
markers = [
    "unit: pure logic, fully mocked",
    "integration: multi-component, backend mocked",
    "module: single module, may touch DB",
    "system: full system",
    "regression: regression tests",
    "llm_e2e: real LLM API tests (costs tokens)",
]

[tool.uv.sources]
editdistance = { path = "models/STT_model/editdistance-0.8.1-py3-none-any.whl" }

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "client",           # Nuxt/Tauri frontend
    "src",              # runtime data (checkpoints, media, rag index)
    "temp",
    ".omo",
    ".playwright-mcp",
]

[tool.ruff.lint]
# Pin the rule set explicitly: ruff's built-in defaults expand across versions
# (0.16 pulled in I/B/C4/RUF/FURB/PLC/PYI), which made the gate unrunnable.
# UP (pyupgrade) enforces Python 3.13+ idioms per [tool.ruff] target-version.
# S110 (try-except-pass) from flake8-bandit: flags silent exception swallowing;
# use # noqa: S110 for intentional cases (ImportError, OSError cleanup, asyncio.CancelledError).
# N (pep8-naming) blocks frontend-style camelCase bleeding into Python code;
# UPPER_SNAKE constants and framework idioms are exempted via pep8-naming below.
# D100-D103+D200 (pydocstyle subset) are the docstring-existence gate; the
# heavy legacy directories are registered below and shrink as they get typed.
select = ["E4", "E7", "E9", "F", "UP", "S110", "N", "D100", "D101", "D102", "D103", "D200", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# Allow Django-style test lifecycle methods and the universal ElementTree `ET` alias
extend-ignore-names = [
    "setUp",
    "tearDown",
    "setUpClass",
    "tearDownClass",
    "ET",
    # UPPER_SNAKE_CASE constants are project convention (also inside functions) —
    # exempt them so N806 only flags real camelCase bleed
    "(?x)[A-Z][A-Z0-9_]*",
]

[tool.basedpyright]
typeCheckingMode = "standard"
exclude = [
    "client",
    "src",
    "temp",
    ".venv",             # site-packages resolve fine even when excluded
    "logs",              # rotating log output
    "**/.*",             # restate pyright default: dot-dirs (.git, .omo, ...)
    "**/__pycache__",    # restate pyright default: bytecode caches
    "**/node_modules",   # restate pyright default
    "docs",
    ".omo",
    ".playwright-mcp",
    "**/vendored_raganything/**",
    "**/vendored_lightrag/**",
    "**/vendored_kg/**",
]
ignore = [
    # Type-debt registry (Phase 1 rollout): these subtrees predate type checking
    # and carry the bulk of the ~3600 diagnostics. Files here are analyzed but
    # their diagnostics are not reported; shrink this list as they get typed.
    # NOTE: keep in sync with the basedpyright hook exclude in
    # .pre-commit-config.yaml (explicitly-passed files bypass this ignore).
    "tests",
    "agent",
    "models",
    "skills",
    "plugins",
    "channels",
    "runtime",
    "docs",
]
[tool.ruff.lint.per-file-ignores]
# Vendored LightRAG / RAG-Anything code - keep close to upstream, don't chase style
"skills/builtin/core/multimodal_rag/scripts/graph_rag/vendored_raganything/*" = ["E402", "F403", "F405", "S110", "N"]
"skills/builtin/core/multimodal_rag/scripts/graph_rag/vendored_lightrag/**" = ["S110", "N"]
# Skill scripts initialize env/model before imports (intentional delayed imports);
# best-effort cleanup uses try-except-pass deliberately
"skills/builtin/**/scripts/*" = ["E402", "S110", "N", "D200", "T20"]
# Tests do sys.path setup before imports; docstring gate does not apply
"tests/**" = ["E402", "D100", "D101", "D102", "D103", "D200", "T20"]
# Vendored FunASR onnxruntime utils (OOXML/feature-array names like pPr, T_lfr are upstream domain terms)
"models/STT_model/utils/*" = ["E722", "S110", "N", "D200", "T20"]

# print allowed in the server entry (startup banner before logging is wired)
"server/__main__.py" = ["T20"]

# --- docstring-existence debt registry (D100-D103): shrink as docstrings land ---
"agent/**" = ["D100", "D101", "D102", "D103", "D200"]
"models/**" = ["D100", "D101", "D102", "D103", "D200"]
"server/**" = ["D100", "D101", "D102", "D103", "D200"]
"runtime/**" = ["D100", "D101", "D102", "D103", "D200"]
"pub_func/**" = ["D100", "D101", "D102", "D103", "D200"]
"context_engine/**" = ["D100", "D101", "D102", "D103", "D200"]
"skills/**" = ["D100", "D101", "D102", "D103", "D200"]

[tool.importlinter]
root_package = "server"

[[tool.importlinter.contracts]]
name = "Server layered dependency contract"
type = "layers"
layers = [
    "server.trigger",
    "server.service",
    "server.queue | server.DAO",
    "server.utils",
]
